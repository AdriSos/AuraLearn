<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraLearn - Mis Cursos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="alumno.css">
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-header">
        <h2>Aura<span class="highlight">Learn</span></h2>
        <p>Panel de Estudiante</p>
    </div>
    <ul class="nav-links">
        <li class="active"><a href="#Cursos" id="linkCursos"><i class="fa-solid fa-graduation-cap"></i> Cursos Disponibles</a></li>
        <li><a href="#Perfil" id="linkPerfil"><i class="fa-solid fa-user-gear"></i> Mi Perfil</a></li>
    </ul>
    <div class="logout">
        <button id="btnSalir"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button>
    </div>
</nav>

<main class="main-content">
    <header class="alumno-header">
        <div class="header-izq">
            <button id="btn-menu" class="btn-toggle"><i class="fa-solid fa-bars"></i></button>
            <h1 id="saludoAlumno">¡Hola, Estudiante!</h1>
        </div>
        <button id="btnTema" class="btn-tema" title="Cambiar Tema"><i class="fa-solid fa-moon"></i></button>
    </header>

    <div id="sec-cursos" class="vista-alumno">
        <p class="subtitle">Explora y comienza tu aprendizaje paso a paso.</p>
        <div id="gridCursos" class="cursos-grid">
            <p>Cargando cursos...</p>
        </div>
    </div>

    <div id="sec-sala-clases" class="vista-alumno" style="display: none;">
        <button id="btnVolverCursos" class="btn-cancelar" style="margin-bottom: 20px;"><i class="fa-solid fa-arrow-left"></i> Volver a Cursos</button>
        <h2 id="tituloCursoActual">Título del Curso</h2>

        <div class="sala-layout">
            <div class="video-container">
                <div id="reproductorYoutube"></div>
            </div>
            <div class="playlist-container">
                <h3>Lecciones del Curso</h3>
                <ul id="listaLeccionesAlumno" class="playlist">
                </ul>
            </div>
        </div>
    </div>

    <div id="sec-perfil" class="vista-alumno" style="display: none;">
        <h2>Mi Perfil</h2>
        <div class="perfil-card">
            <div class="perfil-info">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <h3 id="perfilNombre">Cargando...</h3>
                <p id="perfilCorreo">Cargando...</p>
            </div>
            <form id="formCambiarPassword" class="admin-form" style="margin-top: 20px;">
                <h3>Cambiar Contraseña</h3>
                <div class="input-group">
                    <label>Nueva Contraseña (Mínimo 8 caracteres)</label>
                    <input type="password" id="nuevaPassword" required minlength="8" placeholder="Escribe tu nueva clave">
                </div>
                <button type="submit" class="btn-primary">Actualizar Contraseña</button>
                <div id="mensajePerfil" class="mensaje"></div>
            </form>
        </div>
    </div>

</main>

<script src="alumno.js"></script>
</body>
</html>
