<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraLearn - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1 class="title">Aura<span class="highlight">Learn</span></h1>
            <p class="subtitle">Bienvenido de nuevo</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" required placeholder="tu@correo.com">
                </div>
                
                <div class="input-group">
                    <label for="contrasena">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="contrasena" required placeholder="Ingresa tu contraseña">
                        <button type="button" id="btnOjo" class="btn-ojo">
                            <i class="fa-solid fa-eye" id="iconoOjo"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary" id="btnLogin">Ingresar</button>
            </form>
            
            <div class="enlaces-extra">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
                <p><a href="recuperar.html">Olvidé mi contraseña</a></p>
            </div>

            <div id="mensaje" class="mensaje"></div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
